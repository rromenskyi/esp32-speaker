name: firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware (ESP-IDF v6.0, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32s3
          path: '.'

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/esp32_speaker.bin                   dist/
          cp build/bootloader/bootloader.bin           dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/ota_data_initial.bin                dist/
          (cd dist && sha256sum *.bin > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

      - name: Reset nightly release/tag
        if: github.ref == 'refs/heads/main'
        run: gh release delete nightly --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: dist/*

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          make_latest: true
          generate_release_notes: true
